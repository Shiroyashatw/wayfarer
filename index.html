<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14111c">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>html,body{margin:0;height:100%}[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<title>漫步勇者</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#14111c; --card:#231e2bf2; --card2:#2e2836; --btn:#3a3238; --btnHi:#4a4048; --line:#5a4e5e; --gild:#c9a45c;
  --ink:#f3ede0; --dim:#b3a9bd; --gold:#f2c14e; --hp:#d8343c; --mp:#2f8be0; --xp:#8e5bd6; --good:#7bd36b;
  --f-pix:'DotGothic16','Noto Sans TC',sans-serif; --f-ui:'Noto Sans TC',system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- HUD ---------- */
.hud{position:fixed;top:calc(8px + var(--sat));left:calc(8px + var(--sal));right:calc(8px + var(--sar));display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
.pcard{pointer-events:auto;display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid #00000080;border-radius:12px;padding:6px 10px 6px 6px;box-shadow:0 4px 14px #0007;flex:0 1 230px;min-width:0}
.ava{width:44px;height:44px;border-radius:10px;background:radial-gradient(circle at 50% 40%,#4b4060,#1b1724);flex:none;image-rendering:pixelated}
.pinfo{flex:1;min-width:0;display:grid;gap:3px}
.pname{font-family:var(--f-pix);font-size:13px;display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.pname small{color:var(--dim);font-size:11px}
.mbar{height:6px;background:#0008;border-radius:3px;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:3px;transition:width .3s}
.money{pointer-events:auto;margin-left:auto;display:grid;gap:4px;justify-items:end}
.pill{background:var(--card);border-radius:999px;padding:4px 10px;font-family:var(--f-pix);font-size:13px;box-shadow:0 4px 14px #0007;font-variant-numeric:tabular-nums;white-space:nowrap}
.fab{position:fixed;right:calc(10px + var(--sar));z-index:5;width:48px;height:48px;border-radius:50%;border:1px solid #00000080;background:var(--card);box-shadow:0 4px 14px #0008;display:grid;place-items:center;font-size:18px}
#fabMe{bottom:calc(84px + var(--sab))}
#fabMode{bottom:calc(140px + var(--sab));font-size:11px;font-family:var(--f-pix);line-height:1.1;text-align:center}
.place{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + var(--sat));z-index:4;background:#000000a0;border-radius:999px;padding:3px 12px;font-size:12px;color:var(--dim);white-space:nowrap;max-width:80vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#toast{position:fixed;left:50%;top:calc(100px + var(--sat));transform:translateX(-50%);z-index:30;background:#000000e0;border:1px solid var(--gild);border-radius:10px;padding:8px 14px;font-size:14px;max-width:88vw;text-align:center;pointer-events:none;transition:opacity .3s,transform .3s}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:#16121df5;border-top:1px solid #000;padding:4px var(--sar) calc(4px + var(--sab)) var(--sal)}
.nav button{background:none;border:0;padding:6px 0 4px;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--dim);min-height:56px}
.nav button canvas{width:24px;height:24px;image-rendering:pixelated}
.nav button[aria-current="true"]{color:var(--gold)}

/* ---------- markers ---------- */
.mk{position:relative;width:52px;height:56px;display:grid;place-items:end center;cursor:pointer}
.mk canvas{width:48px;height:48px;image-rendering:pixelated;filter:drop-shadow(0 2px 0 #0009)}
.mk.mon canvas{animation:bob 1.6s ease-in-out infinite}
.mk.far{opacity:.82}
.mk.done{opacity:.4;filter:grayscale(1)}
.mk .lv{position:absolute;top:-4px;left:50%;transform:translateX(-50%);background:#000000c0;border-radius:6px;padding:0 5px;font-family:var(--f-pix);font-size:10px;white-space:nowrap}
.mk .sh{position:absolute;bottom:0;left:50%;width:30px;height:8px;margin-left:-15px;border-radius:50%;background:#0006}
.mk.glow::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:radial-gradient(circle,#7fe0ff66,transparent 65%);animation:pulse 2s ease-in-out infinite}
.me{width:56px;height:60px;display:grid;place-items:end center;pointer-events:none}
.me canvas{width:52px;height:52px;image-rendering:pixelated;filter:drop-shadow(0 3px 0 #0009)}
.me.walk canvas{animation:hop .3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes hop{50%{transform:translateY(-3px)}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.6}}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:#0008}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card2);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px #000a;max-height:82dvh;display:flex;flex-direction:column;padding-bottom:var(--sab);transform:translateY(0);transition:transform .25s ease}
.sheet.off{transform:translateY(105%)}
.grab{width:44px;height:5px;border-radius:3px;background:#ffffff40;margin:8px auto 2px;flex:none}
.shead{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px;gap:8px;flex:none}
.shead h2{margin:0;font-family:var(--f-pix);font-weight:400;font-size:19px;color:var(--gold);letter-spacing:.06em}
.x{background:var(--btn);border:0;border-radius:10px;width:40px;height:40px;font-size:18px}
.sbody{overflow:auto;padding:0 16px 18px;padding-left:max(16px,var(--sal));padding-right:max(16px,var(--sar));display:grid;gap:10px;align-content:start;-webkit-overflow-scrolling:touch}
h3{margin:4px 0 0;font-size:12px;letter-spacing:.14em;color:var(--gild);font-weight:500}
.sub{color:var(--dim);font-size:13px;margin:0;line-height:1.5}
.card{background:#00000038;border:1px solid #0000004d;border-radius:12px;padding:12px;display:grid;gap:8px}
.rowx{display:flex;gap:10px;align-items:center;justify-content:space-between}
.rowx .t{min-width:0;flex:1}
.rowx .t b{font-weight:500}
.rowx .t small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.btn{background:var(--btn);border:1px solid #0000006b;border-radius:10px;min-height:44px;padding:8px 14px;font-size:14px;font-weight:500;box-shadow:inset 0 1px 0 #ffffff14}
.btn:active{background:var(--btnHi)}
.btn:disabled{opacity:.4}
.btn.pri{background:#7a5418;border-color:#c9a45c;color:#ffeec8}
.btn.sm{min-height:38px;padding:6px 12px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 auto}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kv div{background:#0000004d;border-radius:8px;padding:6px 8px;display:grid;font-variant-numeric:tabular-nums}
.kv div span{color:var(--dim);font-size:11px}
.kv div b{font-family:var(--f-pix);font-weight:400;font-size:16px}
.ent{display:flex;gap:12px;align-items:center}
.ent canvas{width:64px;height:64px;image-rendering:pixelated;background:radial-gradient(circle,#ffffff14,transparent 70%);border-radius:12px;flex:none}
.log{display:grid;gap:6px;font-size:13px}
.log div{border-left:2px solid var(--line);padding-left:8px;color:var(--dim)}
.log div:first-child{color:var(--ink);border-color:var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#0005;border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;min-height:40px;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--btnHi);color:var(--ink)}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:50;background:#000b;display:grid;place-items:center;padding:20px calc(16px + var(--sar)) 20px calc(16px + var(--sal))}
.dlg{width:min(420px,100%);max-height:86dvh;overflow:auto;background:var(--card2);border:1px solid var(--gild);border-radius:16px;padding:18px;display:grid;gap:12px;box-shadow:0 10px 40px #000}
.dlg h2{margin:0;font-family:var(--f-pix);font-weight:400;font-size:20px;color:var(--gold)}
.dlg p{margin:0;line-height:1.6}

/* ---------- battle ---------- */
#battle{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
.bview{position:relative;flex:1;min-height:0;overflow:hidden}
#bbg,#bfx{position:absolute;inset:0;width:100%;height:100%}
#bfx{image-rendering:pixelated}
.btop{position:absolute;top:calc(12px + var(--sat));left:calc(16px + var(--sal));right:calc(16px + var(--sar));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.bname{font-family:var(--f-pix);font-size:22px;text-shadow:0 2px 0 #000,0 0 8px #000}
.bname small{display:block;font-size:15px;margin-top:4px}
.bstat{font-size:12px;color:#fff;background:#0009;border-radius:8px;padding:2px 8px;font-family:var(--f-pix)}
.pills{position:absolute;display:grid;gap:6px;transform:translateX(-50%);pointer-events:none}
.bp{width:122px;height:26px;border-radius:5px;position:relative;background:#1a1414;border:2px solid #d9d4cc;box-shadow:0 2px 0 #000a;overflow:hidden;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%)}
.bp i{position:absolute;inset:0 auto 0 0;transition:width .35s}
.bp span{position:relative;display:block;text-align:center;line-height:22px;font-family:var(--f-pix);font-size:14px;text-shadow:0 1px 0 #000}
.bp.hp i{background:linear-gradient(#e0434a,#a8222a)}.bp.mp i{background:linear-gradient(#3a9cf0,#1d64b0)}.bp.xp i{background:linear-gradient(#a06ee6,#6a3fb0)}
.bmsg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:#000000c8;border-top:1px solid #c9a45c88;border-bottom:1px solid #c9a45c88;padding:6px 26px;font-family:var(--f-pix);font-size:17px;white-space:nowrap;transition:opacity .25s;pointer-events:none}
.bcmd{position:relative;background:linear-gradient(#183320,#0c1a10);padding:12px calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal));display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.bcmd .cb{min-height:72px;border-radius:8px;border:1px solid #00000099;background:linear-gradient(#3f3538,#2f2729);box-shadow:inset 0 1px 0 #ffffff1a,0 2px 0 #000a;display:grid;place-items:center;align-content:center;gap:2px;font-size:16px;font-weight:500;padding:6px}
.bcmd .cb img{width:24px;height:24px;image-rendering:pixelated}
.bcmd .cb small{font-size:12px;color:#cfc5bf;font-weight:400}
.bcmd .cb:active{background:linear-gradient(#4f4346,#3a3134)}
.bcmd .cb:disabled{opacity:.42}
.bcmd .cb.run{position:relative;overflow:hidden}
.bcmd .cb.run::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:#8a5a2f}
.bsub{position:absolute;inset:0;background:#0c1a10f5;padding:12px calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal));display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;overflow:auto}
@media (prefers-reduced-motion:reduce){.mk.mon canvas,.me.walk canvas,.mk.glow::before{animation:none}}

#world{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;background:#211d22}
.vign{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 55%,rgba(0,0,0,.55) 100%)}
.topbar{position:fixed;top:calc(8px + var(--sat));left:calc(10px + var(--sal));right:calc(10px + var(--sar));display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
.place{position:static;transform:none;pointer-events:none;background:rgba(20,16,22,.82);border:1px solid rgba(201,164,92,.6);border-radius:6px;padding:6px 14px;font-family:var(--f-pix);font-size:15px;color:#f2d9a6;max-width:62vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.money{display:grid;gap:4px;justify-items:end}
#toast{top:calc(60px + var(--sat))}
#fabMe{bottom:calc(132px + var(--sab));right:calc(12px + var(--sar));font-size:20px}
.onav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-evenly;align-items:flex-end;padding:18px calc(6px + var(--sar)) calc(10px + var(--sab)) calc(6px + var(--sal));background:linear-gradient(transparent,rgba(10,8,12,.85) 45%);pointer-events:none}
.rb{pointer-events:auto;background:none;border:0;padding:0;display:grid;justify-items:center;gap:4px;font-size:11px;color:#d8cfc4;width:64px}
.rb i{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#3a3236,#1d181c);border:2px solid #6b5a4e;box-shadow:0 3px 0 #000a,inset 0 1px 0 #ffffff1a}
.rb canvas{width:26px;height:26px;image-rendering:pixelated}
.rb:active i{transform:translateY(2px)}
.meb{pointer-events:auto;background:none;border:0;padding:0;display:grid;justify-items:center;gap:3px;width:86px;margin-bottom:-2px}
.meb .ring{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#4b4060,#1b1724);border:3px solid var(--gild);box-shadow:0 0 14px rgba(111,170,255,.45),0 3px 0 #000a;display:grid;place-items:center;position:relative}
.meb canvas{width:58px;height:58px;image-rendering:pixelated}
.meb .lvt{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:#14111c;border:1px solid var(--gild);border-radius:6px;padding:0 6px;font-family:var(--f-pix);font-size:11px;color:var(--gold)}
.meb .mb{width:70px;height:7px;border-radius:2px;background:#000a;border:1px solid #000;overflow:hidden}
.meb .mb i{display:block;height:100%;transition:width .3s}

.icard{border:1px solid;border-radius:10px;padding:10px 12px;background:#0006;display:grid;gap:6px}
.ihead{font-family:var(--f-pix);font-size:17px}
.isub{font-size:12px;color:var(--dim)}
.ibase{font-size:13px;color:#d8d2c4;border-top:1px solid #ffffff14;padding-top:6px}
.iaff{display:grid;gap:3px;border-top:1px solid #ffffff14;padding-top:6px;font-size:14px;color:#9fb8ff}
.iaff div{display:flex;justify-content:space-between;gap:8px}
.iaff small{color:var(--dim);font-size:11px;white-space:nowrap}
.orb{display:inline-block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 45%,#0008 100%);vertical-align:-1px;margin-right:4px;box-shadow:0 0 6px var(--c)}
.curs{display:flex;flex-wrap:wrap;gap:6px}
.curs span{background:#0004;border-radius:8px;padding:5px 8px;font-size:13px;white-space:nowrap}
.curs b{font-family:var(--f-pix);font-weight:400;margin-left:2px}
.loot{display:flex;flex-wrap:wrap;gap:6px}
.loot span{background:#0005;border:1px solid #ffffff14;border-radius:8px;padding:4px 8px;font-size:13px}
.eqgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.eqs{background:#0004;border:1px solid #ffffff1f;border-radius:10px;padding:8px 10px;text-align:left;display:grid;gap:2px;min-height:54px;font-size:13px;color:inherit;font-family:inherit}
.eqs small{color:var(--dim);font-size:11px}
.irow{background:#0004;border:0;border-left:3px solid;border-radius:8px;padding:8px 10px;text-align:left;display:grid;gap:2px;color:inherit;font-family:inherit;width:100%}
.irow b{font-weight:500;font-size:14px}
.irow small{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{display:grid;gap:6px}
.crafts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.crafts .btn{display:grid;text-align:left;gap:1px;padding:8px 10px}
.crafts small{font-size:11px;color:var(--dim);font-weight:400}
.treecv{width:100%;max-width:420px;aspect-ratio:1;justify-self:center;border-radius:12px;touch-action:manipulation}
.pdot{position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:#e5484d;border:2px solid #14111c}

.cico{width:16px;height:16px;image-rendering:pixelated;vertical-align:-3px;margin-right:4px}
.cico.lg{width:28px;height:28px;margin:0}
.curs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.curs>span{display:grid;justify-items:center;gap:2px;background:#0004;border-radius:10px;padding:8px 4px;font-size:11px;text-align:center}
.curs>span b{display:block;font-family:var(--f-pix);font-size:15px;font-weight:400;color:var(--ink)}
.bigico{width:56px;height:56px;image-rendering:pixelated;background:radial-gradient(circle,#ffffff14,transparent 70%);border-radius:12px;flex:none}
.irow{display:flex!important;align-items:center;gap:10px}
.irow img{width:36px;height:36px;image-rendering:pixelated;flex:none}
.irow>span{display:grid;gap:2px;min-width:0}
.doll{position:relative;display:grid;grid-template-columns:1fr .85fr 1.1fr .85fr 1fr;grid-template-areas:"w . h a l" "w r1 c r2 l" "g g . b b";gap:8px;padding:10px;border-radius:14px;background:radial-gradient(ellipse at 50% 45%,#3a3046,#16121c 75%);border:1px solid #ffffff14}
#dollHero{position:absolute;left:50%;top:50%;width:150px;height:150px;transform:translate(-50%,-56%);image-rendering:pixelated;opacity:.22;pointer-events:none}
.doll-s{position:relative;background:#0007;border:1px solid #ffffff22;border-radius:10px;display:grid;justify-items:center;align-content:center;gap:4px;padding:8px 4px;min-height:72px;color:inherit;font-family:inherit}
.doll-s img{width:36px;height:36px;image-rendering:pixelated}
.doll-s small{font-size:10.5px;color:var(--dim);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
.doll-s[style*="grid-area:w"],.doll-s[style*="grid-area:l"]{min-height:152px}
.doll-s[style*="grid-area:c"]{min-height:96px}
#expl{line-height:1.35;text-align:right}
.curs>span>span{background:none;padding:0;border-radius:0;display:block;white-space:nowrap}
</style>
<canvas id="world" aria-label="遊戲地圖"></canvas>
<div class="vign"></div>
<div class="topbar"><div class="place" id="place"></div><div class="money"><div class="pill" id="gold"></div><div class="pill" id="cry"></div><div class="pill" id="expl" style="font-size:11px"></div></div></div>
<button class="fab" id="fabMe" data-act="recenter" aria-label="回到我的位置">◎</button>
<div id="toast" style="opacity:0"></div>
<nav class="onav" id="nav">
  <button class="rb" data-act="sheet" data-s="near"><i><canvas data-icon="eye" width="8" height="8"></canvas></i>附近</button>
  <button class="rb" data-act="sheet" data-s="bag"><i><canvas data-icon="bag" width="8" height="8"></canvas></i>背包</button>
  <button class="meb" data-act="sheet" data-s="hero" aria-label="角色"><span class="ring"><canvas id="ava" width="18" height="18"></canvas><span class="lvt" id="lvTag"></span><i class="pdot" id="ptDot" hidden></i></span><span class="mb"><i id="hpb" style="background:var(--hp)"></i></span><span class="mb"><i id="mpb" style="background:var(--mp)"></i></span></button>
  <button class="rb" data-act="sheet" data-s="base"><i><canvas data-icon="castle" width="8" height="8"></canvas></i>據點</button>
  <button class="rb" data-act="sheet" data-s="settings"><i><canvas data-icon="gear" width="8" height="8"></canvas></i>設定</button>
</nav>
<div class="scrim" id="scrim" hidden data-act="closeSheet"></div>
<section class="sheet off" id="sheet" aria-modal="true" role="dialog"><div class="grab"></div><div class="shead"><h2 id="stitle"></h2><button class="x" data-act="closeSheet" aria-label="關閉">✕</button></div><div class="sbody" id="sbody"></div></section>
<div id="battle" hidden>
  <div class="bview" id="bview">
    <canvas id="bbg"></canvas><canvas id="bfx"></canvas>
    <div class="btop"><div class="bname" id="bname"></div><div class="bstat" id="bstat"></div></div>
    <div class="pills" id="hpills"></div><div class="pills" id="epills"></div>
    <div class="bmsg" id="bmsg" style="opacity:0"></div>
  </div>

      if(ch.w==='hat')noise(.03,ch.v,t,7000,'highpass',AU.music);else if(ch.w==='kick')tone(130,.16,'sine',ch.v,t,40,AU.music);else if(ch.w==='snare')noise(.12,ch.v,t,1800,'bandpass',AU.music);
      else tone(nf(ev.n),dur*ev.len*.92,ch.w,ch.v,t,0,AU.music)}
    AU.next+=dur;AU.step++}}

function newGame(){const g={v:5,cls:'novice',lv:1,xp:0,gold:80,crystal:0,hp:60,mp:20,potions:3,ethers:1,inv:[],eq:{},cur:{trans:4,alt:4,aug:2,alch:2,chaos:1,exalt:0,scour:1},tree:['root'],
  lat:START.lat-0.0009,lng:START.lng,walked:0,walkCur:0,bases:[],defeated:{},cleared:{},bought:{},found:{},log:[],timeOffset:0,classOffered:false,music:true,sfx:true,intro:true,trail:[],explMs:0,buff:null,bonusPts:0};

function makeItem(slot,ilvl,rar,baseIdx,r=Math.random){const bl=BASES[slot],bi=baseIdx??fl(r()*bl.length),b=bl[bi];const it={id:uid(),slot,bi,ilvl,r:0,aff:[]};
  if(slot==='weapon'){const k=1+ilvl*.1;it.phys=[Math.round(b.phys[0]*k),Math.round(b.phys[1]*k)];it.crit=b.crit}
  if(b.arm)it.arm=Math.round(b.arm*(6+ilvl*2.5));if(b.imp)it.imp=b.imp;if(b.lure)it.lure=b.lure;
  if(rar===1)toMagic(it,r);else if(rar===2)toRare(it,r);return it}
const baseOf=it=>BASES[it.slot][it.bi];
const slotKey=it=>it.slot==='ring'?'ring':it.slot;
function rollAffix(it,type,r=Math.random){const have=new Set(it.aff.map(a=>a.id));const pool=AFF.filter(a=>a.t===type&&a.slots.includes(slotKey(it))&&!have.has(a.id));if(!pool.length)return false;
  const a=pool[fl(r()*pool.length)],ok=a.tiers.map((t,i)=>({t,i})).filter(o=>o.t[0]<=it.ilvl);let tot=0;ok.forEach(o=>tot+=o.i+1);let x=r()*tot,pick=ok[ok.length-1];for(const o of ok){x-=o.i+1;if(x<0){pick=o;break}}
  const [,lo,hi]=pick.t;it.aff.push({id:a.id,tier:pick.i+1,v:lo+fl(r()*(hi-lo+1))});return true}
const cnt=(it,t)=>it.aff.filter(a=>AFFI[a.id].t===t).length;
function addRandom(it,r=Math.random){const maxP=it.r===1?1:3,maxS=it.r===1?1:3,opts=[];if(cnt(it,'P')<maxP)opts.push('P');if(cnt(it,'S')<maxS)opts.push('S');if(!opts.length)return false;const t=opts[fl(r()*opts.length)];return rollAffix(it,t,r)||rollAffix(it,t==='P'?'S':'P',r)}
function toMagic(it,r=Math.random){it.r=1;it.aff=[];const n=r()<.5?1:2;for(let i=0;i<n;i++)addRandom(it,r);if(!it.aff.length)addRandom(it,r);it.rn=null}
function toRare(it,r=Math.random,n=4){it.r=2;it.aff=[];for(let i=0;i<n;i++)addRandom(it,r);it.rn=RAREA[fl(r()*RAREA.length)]+RAREB[fl(r()*RAREB.length)]}

function itemCard(it,title){const b=baseOf(it);let h=`<div class="icard" style="border-color:${RCOL[it.r]}88"><div class="ihead" style="color:${RCOL[it.r]}">${esc(itemTitle(it))}</div><div class="isub">${it.r===2?esc(b.n)+'・':''}${RNAME[it.r]}${SLOTN[it.slot]}・物品等級 ${it.ilvl}${title?'・'+title:''}</div>`;

/* ================= stats ================= */
function sumStats(){const t={life:0,lifePct:0,physPct:0,flatPhys:0,addFire:0,addCold:0,addLight:0,spellPct:0,elePct:0,armor:0,armorPct:0,mana:0,resFire:0,resCold:0,resLight:0,resAll:0,critPct:0,critMulti:0,leech:0,speed:0,regen:0,physMore:0,vision:0,lure:0};
  for(const s of SLOTS){const it=S.eq[s];if(!it)continue;if(it.arm)t.armor+=it.arm;if(it.imp)t[it.imp[0]]+=it.imp[1];if(it.lure)t.lure+=it.lure;it.aff.forEach(a=>t[a.id]+=a.v)}
  for(const id of S.tree){const n=TREE.byId[id];if(n)for(const k in n.st)t[k]+=n.st[k]}return t}
function stats(){const g=CLASSES[S.cls].g,L=S.lv-1,t=sumStats(),w=S.eq.weapon,ph=w?w.phys:[1,3];const flat=4+g.atk*L+t.flatPhys;
  const eleMul=1+t.elePct/100;
  return{maxhp:Math.round((80+g.hp*L+t.life)*(1+t.lifePct/100)),maxmp:Math.round(20+g.mp*L+t.mana),armor:Math.round((15+g.def*L*4+t.armor)*(1+t.armorPct/100)),
    res:{fire:Math.min(75,t.resFire+t.resAll),cold:Math.min(75,t.resCold+t.resAll),light:Math.min(75,t.resLight+t.resAll)},
    physLo:(ph[0]+flat)*(1+t.physPct/100)*(1+t.physMore/100),physHi:(ph[1]+flat)*(1+t.physPct/100)*(1+t.physMore/100),
    fire:t.addFire*eleMul,cold:t.addCold*eleMul,light:t.addLight*eleMul,spell:(9+3.4*L+g.mag*L*1.2)*(1+t.spellPct/100)*eleMul,
    crit:Math.max(0,Math.min(75,(w?w.crit:5)+t.critPct)),critMulti:Math.max(110,150+t.critMulti),leech:t.leech,speed:10+t.speed,regen:t.regen,
    dodge:Math.max(0,Math.min(30,(t.speed)*1.5)),vision:Math.round((dayPhase().night>.5?260:600)*(1+t.vision/100)),lure:t.lure}}
const xpNeed=lv=>Math.round(20*Math.pow(lv,1.5));
function fullHeal(){const st=stats();S.hp=st.maxhp;S.mp=st.maxmp}
function clampHP(){const st=stats();S.hp=Math.min(S.hp,st.maxhp);S.mp=Math.min(S.mp,st.maxmp)}
function addLog(t){S.log.unshift(t);if(S.log.length>60)S.log.length=60}
function gainXP(n){let up=false;S.xp+=n;while(S.xp>=xpNeed(S.lv)){S.xp-=xpNeed(S.lv);S.lv++;fullHeal();up=true;addLog(`升級了！現在是 Lv${S.lv}，獲得 2 天賦點`)}return up}
const treePts=()=>3+(S.lv-1)*2+(S.bonusPts||0)-(S.tree.length-1);
function dayPhase(){const d=new Date(now()),hr=d.getHours()+d.getMinutes()/60;let night=hr>=19.5||hr<4.5?1:hr>=17.5?(hr-17.5)/2:hr<6.5?(6.5-hr)/2:0;return{hr,night,label:night>=1?'夜晚':night>0?(hr>12?'黃昏':'清晨'):'白天'}}

function paintBG(kind){const x=bbg.getContext('2d'),W=bbg.width,H=bbg.height,r=rng(h(fl(S.lat*1e3),fl(S.lng*1e3),kind.length)),HZ=H*.6;x.save();

    mountain:{sky:['#a9c3e0','#eef2f6'],far:'#9aa9c0',mid:'#7a8a8f',near:'#5c6a60',ground:['#8e9c70','#6c7a52'],fog:'rgba(255,255,255,.55)'},

  else{soft(3,()=>{x.fillStyle=pal.far;for(let i=0;i<W;i+=18*DPR){x.beginPath();x.moveTo(i,0);x.lineTo(i+9*DPR,(40+r()*90)*DPR);x.lineTo(i+18*DPR,0);x.fill()}});}

const BFX={pops:[],fx:[],shake:0,hero:{a:null},en:{a:null,flash:0},t0:0,motes:[]};
const POS=()=>({hx:BW*.27,ex:BW*.72,y:Math.min(BH*.6,BH-118)});

function pop(text,x,y,col){BFX.pops.push({text,x,y,col,t:performance.now()})}

function animOff(who){const a=BFX[who].a;if(!a)return[0,0];const p=(performance.now()-a.t)/a.dur;if(p>=1){BFX[who].a=null;return[0,0]}const s=Math.sin(Math.PI*p);
  if(a.type==='lunge')return[(who==='hero'?1:-1)*BW*.22*s,-6*s];if(a.type==='cast')return[0,-8*s];if(a.type==='hurt')return[(who==='hero'?-8:8)*Math.sin(p*20)*(1-p),0];return[0,0]}
function later(ms,fn){setTimeout(()=>{if(B)fn()},ms)}
function startBattle(e,opts){if(B)return;closeSheet();B={e,...opts,guard:0,poison:0,burn:0,burnDmg:0,shock:0,frozen:0,pFrozen:0,busy:true,sub:null};simTarget=null;
  BFX.pops=[];BFX.fx=[];BFX.en={a:null,flash:0};BFX.hero={a:null};BFX.motes=Array.from({length:30},()=>({x:Math.random(),y:Math.random(),v:rnd(.0005,.0015),p:Math.random()*6.28}));
  sfx('encounter');buzz(60);$('battle').hidden=false;renderBHud();sizeBattle();paintBG(opts.bg||e.bg||'meadow');BFX.t0=performance.now();playSong(B.boss||e.rar===2?'boss':'battle');renderBHud();
  bmsg(e.rar?`${['','魔法','稀有'][e.rar]}怪物：${e.name}`:`${e.name} 出現了！`);setTimeout(()=>{if(B){B.busy=false;renderBHud()}},700)}
function renderBHud(){if(!B)return;const st=stats(),e=B.e,p=POS();

  $('bstat').textContent=[D?`${D.kind==='rift'?'裂隙第':'第'} ${D.room+1}/3 ${D.kind==='rift'?'波':'層'}`:'',B.poison?`中毒 ${B.poison}`:'',B.burn?`燃燒 ${B.burn}`:'',B.shock?`感電 ${B.shock}`:'',B.frozen?'凍結':'',B.guard?`防禦 ${B.guard}`:'',B.pFrozen?'你被凍結':''].filter(Boolean).join('・');$('bstat').hidden=!$('bstat').textContent;
  const pill=(cls,v,max,txt)=>`<div class="bp ${cls}"><i style="width:${Math.max(0,v/max*100)}%"></i><span>${txt??Math.ceil(v).toLocaleString()}</span></div>`;
  const hp=$('hpills');hp.style.left=p.hx+'px';hp.style.top=(p.y+14)+'px';hp.innerHTML=pill('hp',S.hp,st.maxhp)+pill('mp',S.mp,st.maxmp)+pill('xp',S.xp,xpNeed(S.lv),`Lv${S.lv}`);

  let html=slot(sk[0])+cb('攻擊','axe','','skill','data-k="attack"','')+slot(sk[1])+cb('技能','book','','bsub','data-k="skills"','')+cb('逃跑','run',D?'無法逃跑':'','flee','',D?'disabled':'','run')+cb('物品','bag','','bsub','data-k="items"','');
  if(B.sub==='skills')html+=`<div class="bsub">${c.skills.map(k=>cb(SKILLS[k].name,SKILLS[k].icon,SKILLS[k].mp?SKILLS[k].mp+' 魔力':'','skill',`data-k="${k}"`,S.mp<SKILLS[k].mp?'disabled':'')).join('')}${cb('返回','run','','bsub','data-k=""','')}</div>`;
  if(B.sub==='items')html+=`<div class="bsub">${cb('生命藥水','heart','×'+S.potions+'・恢復 40%','bitem','data-k="potions"',S.potions?'':'disabled')}${cb('魔力藥水','ice','×'+S.ethers+'・恢復 50%','bitem','data-k="ethers"',S.ethers?'':'disabled')}${cb('返回','run','','bsub','data-k=""','')}</div>`;
  $('bcmd').innerHTML=html}
/* damage packets: {phys,fire,cold,light} */
function mitigate(pk,arm,res,shock){const tot=pk.phys+pk.fire+pk.cold+pk.light;const pr=pk.phys>0?arm/(arm+10*pk.phys):0;
  let d=pk.phys*(1-pr)+pk.fire*(1-res[0]/100)+pk.cold*(1-res[1]/100)+pk.light*(1-res[2]/100);if(shock)d*=1.2;return Math.max(1,d)}
function playerHit(sk,mult){const st=stats(),e=B.e,p=POS();let pk;
  if(sk.kind==='spell'){pk={phys:0,fire:0,cold:0,light:0};pk[sk.el]=st.spell*mult*rnd(.85,1.15)}
  else pk={phys:rnd(st.physLo,st.physHi)*mult,fire:st.fire*mult*rnd(.8,1.2),cold:st.cold*mult*rnd(.8,1.2),light:st.light*mult*rnd(.3,1.7)};
  let d=mitigate(pk,e.arm,e.res,B.shock>0);const crit=Math.random()*100<st.crit;if(crit)d*=st.critMulti/100;d=Math.round(d);e.hp=Math.max(0,e.hp-d);
  BFX.en.flash=performance.now();anim('en','hurt',300);const main=pk.fire>pk.cold&&pk.fire>pk.light&&pk.fire>pk.phys*.5?'#ffb15a':pk.cold>pk.phys*.5&&pk.cold>pk.light?'#9fe7ff':pk.light>pk.phys*.5?'#fff27a':'#ffffff';
  pop(crit?d+'!':String(d),p.ex+rnd(-12,12),p.y-80,crit?'#ffd166':main);if(crit){BFX.shake=performance.now();sfx('crit');buzz(40)}else sfx('hit');
  if(st.leech&&d>0){const v=Math.max(1,Math.round(d*st.leech/100));S.hp=Math.min(st.maxhp,S.hp+v)}
  if(e.hp>0){if(pk.fire>0&&Math.random()<(sk.el==='fire'?.4:.2)){B.burn=3;B.burnDmg=Math.max(1,Math.round(pk.fire*.3));pop('燃燒',p.ex,p.y-100,'#ffb15a')}
    if(pk.cold>0&&Math.random()<(sk.freeze||.12)){B.frozen=1;pop('凍結',p.ex,p.y-100,'#9fe7ff')}
    if(pk.light>0&&Math.random()<.25){B.shock=2;pop('感電',p.ex,p.y-100,'#fff27a')}}
  if(e.mods&&e.mods.includes('reflect')){const r=Math.max(1,Math.round(d*.15));S.hp=Math.max(1,S.hp-r);pop('-'+r,p.hx,p.y-90,'#ff8a8a')}
  renderBHud()}
function useSkill(k){const sk=SKILLS[k];if(!B||B.busy||S.mp<sk.mp)return;B.busy=true;B.sub=null;S.mp-=sk.mp;sfx('select');bmsg(sk.name);renderBHud();const p=POS();
  if(sk.kind==='attack'){const ranged=sk.fx==='arrow'||CLASSES[S.cls].wep==='bow',hits=sk.hits||1;
    for(let n=0;n<hits;n++)later(n*380,()=>{if(B.e.hp<=0)return;if(ranged){anim('hero','cast',300);sfx('arrow');BFX.fx.push({type:'arrow',t:performance.now(),dur:260})}else{anim('hero','lunge',380);later(140,()=>sfx('slash'))}
      later(ranged?240:170,()=>{BFX.fx.push({type:sk.fx==='whirl'?'whirl':ranged?'pierce':'slash',t:performance.now(),dur:300});playerHit(sk,sk.mult);
        if(sk.guard){B.guard=sk.guard;pop('護甲↑',p.hx,p.y-90,'#9fd4ef')}if(sk.poison&&B.e.hp>0){B.poison=sk.poison;pop('中毒',p.ex,p.y-100,'#9be36b')}})});
    later(hits*380+380,afterPlayer)}
  else if(sk.kind==='spell'){anim('hero','cast',500);BFX.fx.push({type:'charge',t:performance.now(),dur:450});later(360,()=>{sfx(sk.fx);BFX.fx.push({type:sk.fx,t:performance.now(),dur:600})});
    later(700,()=>playerHit(sk,sk.mult));later(1150,afterPlayer)}
  else{anim('hero','cast',500);later(250,()=>{sfx('heal');BFX.fx.push({type:'heal',t:performance.now(),dur:700});const st=stats(),v=Math.round(st.maxhp*.35);S.hp=Math.min(st.maxhp,S.hp+v);pop('+'+v,p.hx,p.y-90,'#7bd36b');renderBHud()});later(1000,afterPlayer)}}
function bItem(k){if(!B||B.busy||!S[k])return;B.busy=true;B.sub=null;sfx('heal');const st=stats(),p=POS();S[k]--;if(k==='potions'){const v=Math.round(st.maxhp*.4);S.hp=Math.min(st.maxhp,S.hp+v);pop('+'+v,p.hx,p.y-90,'#7bd36b')}else{const v=Math.round(st.maxmp*.5);S.mp=Math.min(st.maxmp,S.mp+v);pop('+'+v+' MP',p.hx,p.y-90,'#6ab8ff')}
  BFX.fx.push({type:'heal',t:performance.now(),dur:700});bmsg(k==='potions'?'生命藥水':'魔力藥水');renderBHud();later(800,afterPlayer)}
function flee(){if(!B||B.busy||D)return;B.busy=true;B.sub=null;sfx('select');renderBHud();if(Math.random()<.7){bmsg('成功逃跑！');addLog(`從 ${B.e.name} 身邊逃走了`);later(700,()=>endBattle())}else{bmsg('逃跑失敗！');later(700,afterPlayer)}}
function enemyDead(){BFX.en.dying=performance.now();sfx('win');later(900,winBattle)}
function afterPlayer(){if(B.e.hp<=0)return enemyDead();later(250,enemyTurn)}
function enemyTurn(){const e=B.e,p=POS(),st=stats();
  const dot=(n,col)=>{e.hp=Math.max(0,e.hp-n);pop(String(n),p.ex+rnd(-10,10),p.y-80,col);BFX.en.flash=performance.now();sfx('hit')};
  if(B.poison>0){dot(Math.max(1,Math.round(e.maxhp*.08)),'#9be36b');B.poison--}if(B.burn>0){dot(B.burnDmg,'#ffb15a');B.burn--}if(B.shock>0)B.shock--;renderBHud();
  if(e.hp<=0){later(400,enemyDead);return}
  later(350,()=>{if(B.frozen){B.frozen=0;bmsg(`${e.name} 被凍住，無法行動`);renderBHud();later(800,endEnemyTurn);return}
    const acts=e.mods&&e.mods.includes('swift')&&Math.random()<.35?2:1;let n=0;
    const strike=()=>{const strong=Math.random()<.15;bmsg(strong?`${e.name} 的猛力一擊！`:`${e.name} 的攻擊${acts>1&&n>0?'（第二次）':''}`);anim('en','lunge',420);
      later(210,()=>{if(Math.random()*100<st.dodge){pop('閃避',p.hx,p.y-90,'#d8d2c4');sfx('tap')}else{
        let atk=e.atk*(strong?1.5:1)*rnd(.9,1.1);if(e.mods&&e.mods.includes('fury')&&e.hp<e.maxhp/2)atk*=1.5;
        const pk={phys:0,fire:0,cold:0,light:0};pk[e.el]+=atk;if(e.mods){if(e.mods.includes('fire'))pk.fire+=atk*.4;if(e.mods.includes('cold'))pk.cold+=atk*.4;if(e.mods.includes('shock'))pk.light+=atk*.4}
        const d=Math.round(mitigate(pk,st.armor*(B.guard>0?2:1),[st.res.fire,st.res.cold,st.res.light],false));S.hp=Math.max(0,S.hp-d);anim('hero','hurt',320);BFX.shake=performance.now();sfx('hurt');buzz(strong?120:50);
        pop(String(d),p.hx,p.y-90,pk.fire>pk.phys?'#ffb15a':pk.cold>pk.phys?'#9fe7ff':pk.light>pk.phys?'#fff27a':'#ff8a8a');
        if(e.mods&&e.mods.includes('leech')){const hl=Math.round(d*.15);if(hl>0){e.hp=Math.min(e.maxhp,e.hp+hl);pop('+'+hl,p.ex,p.y-100,'#7bd36b')}}
        if(pk.cold>0&&Math.random()<.12){B.pFrozen=1;pop('你被凍結',p.hx,p.y-110,'#9fe7ff')}}
        renderBHud();if(S.hp<=0){later(700,loseBattle);return}n++;if(n<acts)later(500,strike);else later(500,endEnemyTurn)})};strike()})}
function endEnemyTurn(){if(!B)return;const st=stats();if(B.guard>0)B.guard--;if(st.regen&&S.hp>0){S.hp=Math.min(st.maxhp,S.hp+st.regen)}
  if(B.pFrozen){B.pFrozen=0;bmsg('你被凍住了，跳過這回合');renderBHud();later(900,enemyTurn);return}B.busy=false;renderBHud()}
function dropLoot(e,boss){const buf=buffOn()?1.2:1,rem=D&&D.remote?.8:1,out=[],r=e.rar||0;
  const itemCh=[.22,.5,1][r]*buf*rem,curN=boss?3+fl(Math.random()*2):r===2?2+fl(Math.random()*2):r===1?(Math.random()<.6?1:0)+(Math.random()<.3?1:0):(Math.random()<.25*buf?1:0);
  const slots=['weapon','helm','chest','gloves','boots','ring','amulet'];
  const mk=minR=>{const q=Math.random();let rar=q<.55?0:q<.9?1:2;rar=Math.max(rar,minR);const it=makeItem(slots[fl(Math.random()*slots.length)],e.lv,rar);giveItem(it);out.push(itemName(it))};
  if(boss)mk(2);else if(Math.random()<itemCh)mk(r>=2?1:0);if(r===2&&Math.random()<.5)mk(0);
  for(let i=0;i<Math.round(curN*rem);i++){const c=rollCur(boss||r===2?3:1);giveCur(c);out.push(curDot(c)+CURI[c].n)}
  if(Math.random()<.12){S.potions++;out.push('生命藥水')}return out}
function winBattle(){const e=B.e,mult=(D&&D.remote?.8:1)*(buffOn()?1.2:1),xp=Math.round(e.xp*mult),gold=Math.round(e.gold*rnd(.8,1.2)*mult);S.gold+=gold;const up=gainXP(xp);{const st0=stats();S.hp=Math.min(st0.maxhp,S.hp+Math.round(st0.maxhp*.2));S.mp=Math.min(st0.maxmp,S.mp+Math.round(st0.maxmp*.2))}
  if(B.entId){S.defeated[B.entId]=1;ENT.delete(B.entId)}const drops=dropLoot(e,B.boss);let bonus='';
  if(B.bounty){const g=100+S.lv*30;S.gold+=g;giveCur('chaos');bonus=`<p style="color:var(--gold)">懸賞完成！額外 ${g} 金幣與 1 個混沌石</p>`;S.cleared[B.bounty]=evEp()}
  addLog(`擊敗 ${e.name} Lv${e.lv}，獲得 ${xp} 經驗、${gold} 金幣`);if(up)setTimeout(()=>sfx('level'),500);renderBHud();save();const inD=!!D;
  const next=()=>{if(inD){D.room++;if(D.room>=3)return dungeonClear();const st=stats();S.hp=Math.min(st.maxhp,S.hp+Math.round(st.maxhp*.15));S.mp=Math.min(st.maxmp,S.mp+Math.round(st.maxmp*.15));
      showModal(D.kind==='rift'?`裂隙第 ${D.room+1}/3 波`:`第 ${D.room+1}/3 層`,`<p>${D.room===2?(D.kind==='rift'?'裂隙深處湧出一隻稀有怪物。':'更深處傳來強大的氣息，首領就在前方。'):'下一波敵人正在逼近。'}</p><p class="sub">生命 ${S.hp}/${st.maxhp}・魔力 ${S.mp}/${st.maxmp}</p>`,
        [{label:'撤退',fn:()=>{hideModal();addLog('撤退了');D=null;endBattle()}},{label:'繼續',pri:1,fn:()=>{hideModal();nextRoom()}}])}else{hideModal();endBattle()}};
  const cont=()=>{if(S.cls==='novice'&&S.lv>=5&&!S.classOffered){S.classOffered=true;classModal(next)}else next()};
  showModal('勝利！',`<p>獲得 <span style="color:var(--good)">${xp} 經驗</span>、<span style="color:var(--gold)">${gold} 金幣</span></p>${drops.length?`<div class="loot">${drops.map(d=>`<span>${d}</span>`).join('')}</div>`:''}${bonus}${up?`<p style="color:var(--gold)">升級到 Lv${S.lv}！狀態全滿，獲得 2 天賦點</p>`:''}`,[{label:'繼續',pri:1,fn:cont}])}
function loseBattle(){sfx('lose');buzz(300);const lost=fl(S.gold*.1);S.gold-=lost;fullHeal();D=null;const main=S.bases.find(b=>b.type==='main');

function drawFx(c,f,q,p,u){const ex=p.ex,ey=p.y-8*u;c.save();c.globalCompositeOperation='lighter';

  else if(f.type==='arrow'){const x=p.hx+6*u+(ex-p.hx-6*u)*q;c.fillStyle='#fff';c.fillRect(x-8,ey,16,2)}
  else if(f.type==='pierce'){c.fillStyle=`rgba(255,255,220,${1-q})`;for(let k=0;k<6;k++){const a=k/6*6.28;c.fillRect(ex+Math.cos(a)*q*34,ey+Math.sin(a)*q*34,3,3)}}
  else if(f.type==='charge')blob(c,p.hx+5*u,p.y-18*u,10+40*q,'rgba(170,200,255,.6)');
  else if(f.type==='fire'){for(let k=0;k<26;k++){const a=k*2.39,r=q*56*(.4+(k%5)/5),y=ey-q*22*(k%3);c.fillStyle=k%2?`rgba(255,140,40,${1-q})`:`rgba(255,220,90,${1-q})`;const s=7*(1-q)+2;c.fillRect(ex+Math.cos(a)*r-s/2,y+Math.sin(a)*r*.6-s/2,s,s)}blob(c,ex,ey,80,`rgba(255,120,40,${.55*(1-q)})`)}
  else if(f.type==='ice'){for(let k=0;k<8;k++){const a=k/8*6.28,r=44*(1-q)+8;c.fillStyle=`rgba(170,235,255,${1-q*.7})`;c.save();c.translate(ex+Math.cos(a)*r,ey+Math.sin(a)*r*.7);c.rotate(a);c.fillRect(-11,-2,22,4);c.restore()}blob(c,ex,ey,70,`rgba(140,220,255,${.5*(1-q)})`)}

  c.restore()}

function genRoads(){const minor=[],G=GRIDS.map(g=>({...g,cm:toM(g.c[0],g.c[1]),ar:g.a*Math.PI/180}));

    const P=(i,j)=>{const jx=((h(i,j,gi*7+1)%100)/100-.5)*g.s*.18,jy=((h(i,j,gi*7+2)%100)/100-.5)*g.s*.18,u=i*g.s+jx,v=j*g.s+jy;return[g.cm[0]+u*ca-v*sa,g.cm[1]+u*sa+v*ca]};
    for(let i=-n;i<=n;i++)for(let j=-n;j<=n;j++){const a=P(i,j);for(const [di,dj,k] of [[1,0,3],[0,1,4]]){const b=P(i+di,j+dj);if(own((a[0]+b[0])/2,(a[1]+b[1])/2)!==g)continue;if(h(i,j,gi*11+k)%100<16)continue;minor.push([a,b])}}});
  const major=ARTERIALS.map(r=>r.map(p=>toM(p[0],p[1]))),water=WATERS.map(r=>r.map(p=>toM(p[0],p[1]))),strips=STRIPS.map(r=>r.map(p=>toM(p[0],p[1])));
  const mk=lines=>{const p=new Path2D();for(const l of lines){p.moveTo(l[0][0],l[0][1]);for(let k=1;k<l.length;k++)p.lineTo(l[k][0],l[k][1])}return p};
  const segs=[];minor.forEach(s=>segs.push(s));major.forEach(l=>{for(let k=1;k<l.length;k++)segs.push([l[k-1],l[k]])});
  RD={minor:mk(minor),major:mk(major),water:mk(water),strips:mk(strips),segs,parks:PARKS.map(p=>({...p,m:toM(p.lat,p.lng)}))}}
function snapRoad(x,y,maxD){let best=null,bd=maxD;for(const [a,b] of RD.segs){if(Math.min(a[0],b[0])-maxD>x||Math.max(a[0],b[0])+maxD<x||Math.min(a[1],b[1])-maxD>y||Math.max(a[1],b[1])+maxD<y)continue;

  trailStep();refreshEntities();checkArrive()}
function checkArrive(){const b=S.bases.find(b=>dist(S.lat,S.lng,b.lat,b.lng)<25);if(b&&!checkArrive.b){const st=stats();if(S.hp<st.maxhp||S.mp<st.maxmp){fullHeal();toast(`回到${baseName(b)}，狀態全滿`);sfx('heal');renderHud()}}checkArrive.b=!!b;
  for(const t of TOWNS){if(!S.found[t.id]&&dist(S.lat,S.lng,t.lat,t.lng)<120){S.found[t.id]=1;const g=40+S.lv*15,c=rollCur(2);S.gold+=g;S.crystal++;giveCur(c);sfx('level');toast(`發現城鎮「${t.n}」！+${g} 金幣、1 魔晶、1 個${CURI[c].n}`);addLog(`發現城鎮「${t.n}」`);renderHud()}}}
function tick(t){requestAnimationFrame(tick);const dt=Math.min(.1,(t-lastFrame)/1000||0);lastFrame=t;

let tdrag=null;

  for(const n of TREE.N){const d=Math.hypot(n.x-px,n.y-py);if(d<bd){bd=d;best=n}}if(best){selNode=best.id;sfx('tap');renderSheet()}});

/* ================= bases ================= */
const P30=30*60e3;
const prodRate=b=>(b.type==='main'?60:30)*b.lv;
const stored=b=>Math.floor(Math.min(prodRate(b)*8,prodRate(b)*(now()-b.last)/3.6e6));
function charges(b){const t=now();if(b.exp>=3){b.expTs=t;return 3}const k=fl((t-b.expTs)/P30);if(k>0){b.exp=Math.min(3,b.exp+k);b.expTs+=k*P30;if(b.exp>=3)b.expTs=t}return b.exp}
const baseName=b=>b.type==='main'?'主據點':`分支據點 ${S.bases.filter(q=>q.type==='branch').indexOf(b)+1}`;
function baseTarget(b){const [bx,by]=toM(b.lat,b.lng);let best=null;
  for(let i=fl((bx-1500)/DCELL);i<=fl((bx+1500)/DCELL);i++)for(let j=fl((by-1500)/DCELL);j<=fl((by+1500)/DCELL);j++){const r=h(i,j,41);if(r%100>=30)continue;const x=(i+.15+((r>>>8)%70)/100)*DCELL,y=(j+.15+((r>>>16)%70)/100)*DCELL,id=`d${i}_${j}`;
    if(Math.hypot(x,y)>BOUND||nearTown(x,y,160)||S.cleared[id]===hourEp())continue;const d=Math.hypot(x-bx,y-by);if(!best||d<best.d){const [la,ln]=toLL(x,y);best={id,name:'洞窟',lat:la,lng:ln,d,lv:S.lv+1,kind:'dungeon'}}}
  for(const t of TOWNS){const d=Math.hypot(t.x-bx,t.y-by);if(d<1500&&S.found[t.id]&&S.cleared[t.id]!==hourEp()&&(!best||d<best.d))best={id:t.id,name:t.dn,lat:t.lat,lng:t.lng,d,lv:townLv(t),kind:'landmark',dn:t.dn}}return best}
function branchCheck(){if(!S.bases.some(b=>b.type==='main'))return'先建立主據點';if(S.bases.filter(b=>b.type==='branch').length>=3)return'分支據點已達上限 3 座';if(S.gold<150)return'需要 150 金幣';
  if(nearTownE())return'城鎮範圍內不能建立據點';const near=S.bases.find(b=>dist(b.lat,b.lng,S.lat,S.lng)<1000);if(near)return`離${baseName(near)}太近，需要相距 1 公里以上`;return''}

  [cam.x,cam.y]=toM(S.lat,S.lng);refreshEntities(true);renderHud();
  if(S.intro){delete S.intro;addLog('冒險開始！');showModal(`漫步勇者 v${VER}`,`<p>真實世界就是你的冒險地圖。道路跟著真實街道走，知名地點會變成城鎮。</p><p class="sub">一開始地圖被迷霧覆蓋，走過的地方才會揭開。點路面讓角色走過去，走進黃色圈內就能戰鬥、開寶箱、參拜。發光的怪物是菁英，掉寶更好；城鎮附近會出現限時事件。背包裡已經放了幾件裝備、一盞提燈和一些通貨，可以先試試改造裝備。晚上視野會縮小，提燈能照得更遠，但也會引來更多怪物。</p>`,[{label:'開始冒險',pri:1,fn:()=>{hideModal();checkArrive();save()}}])}else checkArrive();
  requestAnimationFrame(tick)}
start();
