<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14111c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>漫步勇者</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=0.3.1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<canvas id="world" aria-label="遊戲地圖"></canvas>
<div class="vign"></div>
<div class="topbar"><div class="money"><div class="pill" id="gold"></div><div class="pill" id="cry"></div><div class="pill" id="expl" style="font-size:11px"></div></div></div>
<div class="lbar"><button class="lfab" data-act="gacha" aria-label="祈願"><i><canvas data-icon="gift" width="8" height="8"></canvas><b class="ndot" id="gaDot" hidden></b></i><span>祈願</span></button><button class="lfab hunt" data-act="hunt" aria-label="狩獵"><i><canvas data-icon="eye" width="8" height="8"></canvas><b class="hbadge" id="huntN">0</b></i><span>狩獵</span></button></div>
<button class="fab" id="fabMe" data-act="recenter" aria-label="回到我的位置">◎</button>
<button class="ptpill" id="ptPill" data-act="ptOpen" hidden></button>
<div id="toast" style="opacity:0"></div>
<div class="osm">地圖資料 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> 貢獻者</div>
<nav class="onav" id="nav">
  <button class="rb" data-act="nav" data-g="adv" aria-expanded="false"><i><canvas data-icon="flag" width="8" height="8"></canvas></i>冒險</button>
  <button class="rb" data-act="nav" data-g="soc" aria-expanded="false"><i><canvas data-icon="party" width="8" height="8"></canvas><b class="ndot" id="socDot" hidden></b></i>社交</button>
  <button class="meb" data-act="nav" data-g="me" aria-expanded="false" aria-label="角色"><span class="ring"><svg class="xparc" viewBox="0 0 100 56" aria-hidden="true"><path class="xbg" d="M6 52 A44 44 0 0 1 94 52" pathLength="100"/><path class="xfg" id="xpArc" d="M6 52 A44 44 0 0 1 94 52" pathLength="100"/></svg><canvas id="ava" width="18" height="18"></canvas><span class="lvt" id="lvTag"></span><i class="pdot" id="ptDot" hidden></i></span><span class="mb"><i id="hpb" style="background:var(--hp)"></i></span><span class="mb"><i id="mpb" style="background:var(--mp)"></i></span></button>
  <button class="rb" data-act="sheet" data-s="bag"><i><canvas data-icon="bag" width="8" height="8"></canvas></i>背包</button>
  <button class="rb" data-act="sheet" data-s="settings"><i><canvas data-icon="gear" width="8" height="8"></canvas></i>設定</button>
</nav>
<div class="npop" id="npop" hidden></div>
<div class="scrim" id="scrim" hidden data-act="closeSheet"></div>
<section class="sheet off" id="sheet" aria-modal="true" role="dialog"><div class="shead"><h2 id="stitle"></h2><button class="x" data-act="closeSheet" aria-label="關閉">✕</button></div><div class="sbody" id="sbody"></div></section>
<div id="battle" hidden>
  <div class="bview" id="bview">
    <canvas id="bbg"></canvas><canvas id="bfx"></canvas>
    <div class="btop"><div class="bstat" id="bstat"></div></div><div class="bfloor" id="bfloor" hidden></div><div class="bname" id="bname"></div><div class="bboss" id="bboss" hidden></div><div class="ailbox" id="eail"></div><div class="ailbox" id="hail"></div><div class="border" id="border"></div>
    <div class="pills" id="hpills"></div><div class="pills" id="epills"></div><div id="mpills"></div>
    <div class="bmsg" id="bmsg" style="opacity:0"></div>
  </div>
  <div class="bcmd" id="bcmd"></div>
</div>
<div id="treeView" hidden><canvas id="treeCv" aria-label="天賦樹"></canvas>
  <div class="tvTop"><div class="tvPts" id="tvPts"></div><button class="x" data-act="closeTree" aria-label="關閉">✕</button></div>
  <div class="tvBottom"><div class="tvTools"><button class="btn sm" data-act="treeFit">回到起點</button><button class="btn sm" data-act="treeReset">全部重置</button><button class="btn sm" data-act="treeBonus">測試 +10 點</button></div>
  <div class="tvCard card" id="tvCard"></div></div></div>
<div id="ascView" hidden><canvas id="ascCv" aria-label="昇華盤"></canvas>
  <div class="tvTop"><div class="tvPts" id="avPts"></div><button class="x" data-act="ascClose" aria-label="關閉">✕</button></div>
  <div class="avCls" id="avCls"></div>
  <div class="tvBottom"><div class="tvTools"><button class="btn sm" data-act="ascFit">我的分支</button><button class="btn sm" data-act="ascFitAll">全覽</button></div>
  <div class="tvCard card" id="avCard"></div></div></div>
<div id="gacha" hidden></div>
<div id="tut" hidden><div id="tutHole" hidden></div><div class="card" id="tutBox"></div></div>
<div id="modal" hidden><div class="dlg" id="dlg"></div></div>
<script src="js/core.js?v=0.3.1"></script>
<script src="js/data.js?v=0.3.1"></script>
<script src="js/sprites.js?v=0.3.1"></script>
<script src="js/gear.js?v=0.3.1"></script>
<script src="js/skills.js?v=0.3.1"></script>
<script src="js/audio.js?v=0.3.1"></script>
<script src="js/items.js?v=0.3.1"></script>
<script src="js/battle.js?v=0.3.1"></script>
<script src="js/map.js?v=0.3.1"></script>
<script src="js/tree.js?v=0.3.1"></script>
<script src="js/ui.js?v=0.3.1"></script>
<script src="js/endgame.js?v=0.3.1"></script>
<script src="js/undead.js?v=0.3.1"></script>
<script src="js/demon.js?v=0.3.1"></script>
<script src="js/hunt.js?v=0.3.1"></script>
<script src="js/daily.js?v=0.3.1"></script>
<script src="js/asc.js?v=0.3.1"></script>
<script src="js/gacha.js?v=0.3.1"></script>
<script src="js/tutor.js?v=0.3.1"></script>
<script src="js/cloud.js?v=0.3.1"></script>
<script src="js/social.js?v=0.3.1"></script>
<script src="js/mp.js?v=0.3.1"></script>
<script src="js/main.js?v=0.3.1"></script>
</body>
</html>
